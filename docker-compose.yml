##
## -----------------------------------
## | 3 D P R I N T E R - D O C K E R |
## -----------------------------------
##
## Container based 3D Printer tools configuration
##
## -- DO NOT EDIT THIS FILE --
##
## Configuration items for this file are taken from the .env file
##
## Have docker-compose.yml and .env in the same directory to launch the stack

version: '3'

######################
# SERVICES TO LAUNCH #
######################

services:
  # ----------------------------------------
  # SPOOLMAN
  # 3D Printer Filament Tracker
  # ----------------------------------------

  spoolman:
    image: ghcr.io/donkie/spoolman:latest
    container_name: spoolman
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-file: '${LOG_FILE_NUM}'
        max-size: '${LOG_FILE_SIZE}'
    ports:
      - '${SPOOLMAN_PORT}:8000'
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - '${BASE_DOCKER_PATH}/spoolman:/home/app/.local/share/spoolman'
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ----------------------------------------
  # BAMBU AMS FILAMENT STATUS
  # Filament Info from AMS to Spoolman
  # ----------------------------------------

  bambulab-ams-spoolman-filamentstatus:
    image: ghcr.io/rdiger-36/bambulab-ams-spoolman-filamentstatus:latest
    container_name: amsfilament
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-file: '${LOG_FILE_NUM}'
        max-size: '${LOG_FILE_SIZE}'
    depends_on:
      spoolman:
        condition: service_started
        restart: true
    ports:
      - '${BAMBUAMS_PORT}:4000'
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - SPOOLMAN_ENDPOINT=${SPOOLMAN_ENDPOINT}
      - UPDATE_INTERVAL=${UPDATE_INTERVAL}
      - MODE=${BAMBUAMS_MODE}
    volumes:
      - '${BASE_DOCKER_PATH}/amsfilament/printers:/app/printers'
      - '${BASE_DOCKER_PATH}/amsfilament/logs:/app/logs'
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    